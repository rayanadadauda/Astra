<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Astra — secure delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 25%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,0.01) 0%, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
    position: relative;
    z-index: 2;
    padding: 1.5rem;
    transform: translateZ(0);
    backdrop-filter: blur(2px);
  }

  .logo-wrap {
    position: relative;
    width: 136px;
    height: 136px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
  }

  .logo-glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,245,0.2) 0%, rgba(255,255,255,0) 70%);
    animation: glowPulse 2.4s ease-in-out infinite;
    filter: blur(4px);
  }

  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.22); opacity: 1; }
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.2px solid rgba(255,255,240,0.25);
    animation: ringExpand 2.4s ease-out infinite;
    box-shadow: 0 0 6px rgba(255,245,200,0.2);
  }
  .ring:nth-child(3) {
    animation-delay: 0.9s;
    opacity: 0.6;
  }

  @keyframes ringExpand {
    0% { transform: scale(0.7); opacity: 0.7; }
    100% { transform: scale(1.65); opacity: 0; }
  }

  .logo-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 14px rgba(255,255,220,0.7)) drop-shadow(0 0 28px rgba(255,215,150,0.4));
    transition: filter 0.2s ease;
  }

  .msg-area {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 34px;
    width: 400px;
    max-width: 86vw;
    overflow: hidden;
    position: relative;
  }

  .msg {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 5vw, 1.35rem);
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #fefefe, #ddd9ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    position: absolute;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.45s ease;
    white-space: nowrap;
    text-shadow: 0 0 1px rgba(0,0,0,0.2);
  }
  .msg.show {
    opacity: 1;
    transform: translateY(0);
  }
  .msg.hide {
    opacity: 0;
    transform: translateY(-14px);
  }

  .progress-track {
    width: 300px;
    max-width: 78vw;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.2);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fff8e7, #ffffff, #e2ddff);
    border-radius: 3px;
    width: 0%;
    transition: width 0.6s cubic-bezier(0.22, 0.97, 0.36, 1);
    box-shadow: 0 0 4px #fff3bf;
  }

  .pct {
    font-family: 'Syne', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    color: rgba(255,255,245,0.45);
    background: rgba(10,10,20,0.5);
    backdrop-filter: blur(2px);
    padding: 4px 12px;
    border-radius: 40px;
  }

  .status-footnote {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.7rem;
    font-family: monospace;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.3);
    width: fit-content;
    margin: 0 auto;
    padding: 4px 14px;
    border-radius: 40px;
    backdrop-filter: blur(8px);
    pointer-events: none;
    z-index: 3;
  }

  @media (max-width: 520px) {
    .logo-wrap { width: 110px; height: 110px; margin-bottom: 36px; }
    .logo-img { width: 64px; height: 64px; }
    .msg-area { margin-bottom: 28px; }
    .pct { font-size: 0.6rem; letter-spacing: 0.2em; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <img class="logo-img" src="logo.png" alt="Astra" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'46\' fill=\'none\' stroke=\'white\' stroke-width=\'1.5\' stroke-dasharray=\'4 3\'/%3E%3Cpath fill=\'white\' d=\'M50 28 L55 42 L70 44 L59 53 L63 68 L50 59 L37 68 L41 53 L30 44 L45 42 Z\' opacity=\'0.9\'/%3E%3C/svg%3E';"> 
  </div>

  <div class="msg-area">
    <div class="msg show" id="m0">⚡ initializing delivery</div>
    <div class="msg" id="m1">🔒 verifying secure channel</div>
    <div class="msg" id="m2">📦 preparing astra.zip</div>
    <div class="msg" id="m3">⬇️ establishing stream</div>
    <div class="msg" id="m4">✨ ready — download start</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="bar"></div>
  </div>
  <div class="pct" id="pct">0%</div>
</div>
<div class="status-footnote">astra • protected payload</div>

<script>
  (function() {
    const FILE_NAME = "astra.zip";
    const currentPath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const downloadUrl = currentPath + FILE_NAME;
    
    const steps = [
      { id: 'm0', percent: 12, delayMs: 0 },
      { id: 'm1', percent: 34, delayMs: 1300 },
      { id: 'm2', percent: 62, delayMs: 2700 },
      { id: 'm3', percent: 86, delayMs: 4100 },
      { id: 'm4', percent: 100, delayMs: 5300 }
    ];
    
    const barEl = document.getElementById('bar');
    const pctEl = document.getElementById('pct');
    
    function updateProgress(percent, activeMsgId) {
      if (barEl) barEl.style.width = percent + '%';
      if (pctEl) pctEl.textContent = percent + '%';
      
      for (let i = 0; i < steps.length; i++) {
        const msgDiv = document.getElementById(steps[i].id);
        if (!msgDiv) continue;
        if (steps[i].id === activeMsgId) {
          if (!msgDiv.classList.contains('show')) {
            msgDiv.classList.add('show');
            msgDiv.classList.remove('hide');
          }
        } else {
          if (msgDiv.classList.contains('show')) {
            msgDiv.classList.remove('show');
            msgDiv.classList.add('hide');
          }
        }
      }
    }
    
    steps.forEach((step, idx) => {
      setTimeout(() => {
        updateProgress(step.percent, step.id);
        
        if (idx === steps.length - 1) {
          setTimeout(() => {
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = FILE_NAME;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
              if (link.parentNode) document.body.removeChild(link);
            }, 100);
          }, 550);
        }
      }, step.delayMs);
    });
    
    function subtleUrlDance() {
      const fakePaths = ["/core", "/secure", "/pulse", "/sync", "/astra", "/delivery", "/edge"];
      let idx = 0;
      setInterval(() => {
        try {
          const nextPath = fakePaths[idx % fakePaths.length];
          const randomQuery = Math.random().toString(36).substring(2, 6);
          const newStateUrl = window.location.pathname + '?v=' + randomQuery + nextPath;
          history.replaceState({}, "", newStateUrl);
          idx++;
        } catch(e) {}
      }, 380);
    }
    
    subtleUrlDance();
  })();
</script>
</body>
</html>
